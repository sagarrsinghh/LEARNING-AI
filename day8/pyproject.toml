[project]
name = "day8"
version = "0.1.0"
description = "Resume and job description matcher"
requires-python = ">=3.10"
dependencies = [
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/day8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
